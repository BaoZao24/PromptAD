<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7fafc"/>
      <stop offset="1" stop-color="#e8eef6"/>
    </linearGradient>
    <linearGradient id="spec" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#1b2440"/>
      <stop offset="0.25" stop-color="#255f8f"/>
      <stop offset="0.50" stop-color="#2ca25f"/>
      <stop offset="0.75" stop-color="#f0c34a"/>
      <stop offset="1" stop-color="#f05a3f"/>
    </linearGradient>
    <linearGradient id="gradTime" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.50" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="gradFreq" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.50" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 48px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 23px Arial, sans-serif; fill: #475569; }
      .panelTitle { font: 700 28px Arial, sans-serif; fill: #111827; }
      .label { font: 600 20px Arial, sans-serif; fill: #334155; }
      .small { font: 400 18px Arial, sans-serif; fill: #475569; }
      .formula { font: 700 24px Arial, sans-serif; fill: #0f172a; }
      .axis { stroke: #334155; stroke-width: 3; marker-end: url(#arrow); }
      .thin { stroke: #94a3b8; stroke-width: 2; }
      .arrow { stroke: #334155; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .card { fill: #ffffff; stroke: #d7dee8; stroke-width: 2; rx: 18; filter: url(#shadow); }
      .chip { fill: #e0f2fe; stroke: #7dd3fc; stroke-width: 1.5; rx: 14; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="78" class="title">Spectral Gradient Input</text>
  <text x="80" y="116" class="subtitle">Convert one RF spectrogram into three physical channels: intensity, temporal change, and frequency change.</text>

  <rect x="74" y="160" width="395" height="565" class="card"/>
  <text x="105" y="208" class="panelTitle">Original Spectrogram</text>
  <text x="105" y="238" class="small">I(t, f): signal power map</text>
  <rect x="118" y="285" width="295" height="285" rx="10" fill="#0f172a" stroke="#d7dee8" stroke-width="2"/>
  <rect x="138" y="305" width="255" height="245" rx="6" fill="url(#spec)" opacity="0.85"/>
  <g opacity="0.95">
    <path d="M150,505 C205,500 240,465 294,442 C330,428 358,415 382,392" stroke="#f8fafc" stroke-width="10" fill="none" opacity="0.55"/>
    <rect x="188" y="332" width="36" height="175" rx="8" fill="#fde68a" opacity="0.70"/>
    <rect x="250" y="360" width="115" height="82" rx="10" fill="#a7f3d0" opacity="0.36"/>
  </g>
  <line x1="138" y1="565" x2="396" y2="565" class="axis"/>
  <line x1="118" y1="550" x2="118" y2="292" class="axis"/>
  <text x="240" y="608" class="label">time</text>
  <text x="68" y="430" class="label" transform="rotate(-90 68 430)">frequency</text>
  <text x="105" y="662" class="formula">Channel 1 = I</text>
  <text x="105" y="694" class="small">keeps the original energy distribution</text>

  <path d="M500,445 C555,445 590,445 635,445" class="arrow"/>
  <text x="505" y="410" class="small">compute differences</text>

  <rect x="665" y="160" width="395" height="565" class="card"/>
  <text x="696" y="208" class="panelTitle">Temporal Gradient</text>
  <text x="696" y="238" class="small">changes along the time axis</text>
  <rect x="710" y="285" width="295" height="285" rx="10" fill="#0f172a" stroke="#d7dee8" stroke-width="2"/>
  <rect x="730" y="305" width="255" height="245" rx="6" fill="#101827"/>
  <g>
    <rect x="772" y="318" width="16" height="219" fill="#67e8f9" opacity="0.72"/>
    <rect x="825" y="318" width="12" height="219" fill="#e0f2fe" opacity="0.55"/>
    <path d="M742,508 C800,495 842,463 886,438 C930,412 956,391 974,366" stroke="url(#gradTime)" stroke-width="14" fill="none" opacity="0.80"/>
    <rect x="905" y="357" width="14" height="87" fill="#e0f2fe" opacity="0.45"/>
  </g>
  <line x1="730" y1="565" x2="988" y2="565" class="axis"/>
  <line x1="710" y1="550" x2="710" y2="292" class="axis"/>
  <text x="826" y="608" class="label">time</text>
  <text x="660" y="430" class="label" transform="rotate(-90 660 430)">frequency</text>
  <text x="696" y="662" class="formula">Channel 2 = |I(t) - I(t-1)|</text>
  <text x="696" y="694" class="small">highlights sudden appearances, offsets, and edges</text>

  <rect x="1129" y="160" width="395" height="565" class="card"/>
  <text x="1160" y="208" class="panelTitle">Frequency Gradient</text>
  <text x="1160" y="238" class="small">changes along the frequency axis</text>
  <rect x="1174" y="285" width="295" height="285" rx="10" fill="#0f172a" stroke="#d7dee8" stroke-width="2"/>
  <rect x="1194" y="305" width="255" height="245" rx="6" fill="#101827"/>
  <g>
    <rect x="1210" y="354" width="223" height="10" fill="#bbf7d0" opacity="0.72"/>
    <rect x="1210" y="447" width="223" height="14" fill="#dcfce7" opacity="0.58"/>
    <path d="M1208,512 C1260,494 1298,462 1344,438 C1388,413 1416,389 1438,360" stroke="url(#gradFreq)" stroke-width="14" fill="none" opacity="0.78"/>
    <rect x="1238" y="336" width="36" height="174" rx="7" fill="#86efac" opacity="0.34"/>
  </g>
  <line x1="1194" y1="565" x2="1452" y2="565" class="axis"/>
  <line x1="1174" y1="550" x2="1174" y2="292" class="axis"/>
  <text x="1294" y="608" class="label">time</text>
  <text x="1124" y="430" class="label" transform="rotate(-90 1124 430)">frequency</text>
  <text x="1160" y="662" class="formula">Channel 3 = |I(f) - I(f-1)|</text>
  <text x="1160" y="694" class="small">highlights band boundaries and swept-frequency traces</text>

  <rect x="245" y="768" width="1110" height="74" class="chip"/>
  <text x="278" y="814" class="label">Final 3-channel input to PromptAD:</text>
  <text x="610" y="814" class="formula">[ intensity, temporal gradient, frequency gradient ]</text>
  <text x="278" y="846" class="small">Best suited for burst and chirp structures; DSSS often needs RGB or broadband texture/statistical features instead.</text>
</svg>
