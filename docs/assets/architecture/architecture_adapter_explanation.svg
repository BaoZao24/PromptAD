<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#243447"/>
    </marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#b42318"/>
    </marker>
    <style>
      .bg { fill: #f6f7f9; }
      .panel { fill: #ffffff; stroke: #d5d9e0; stroke-width: 2; rx: 8; }
      .box { fill: #f8fafc; stroke: #8fa0b3; stroke-width: 2; rx: 8; }
      .boxBlue { fill: #eaf3ff; stroke: #3b82c4; stroke-width: 2; rx: 8; }
      .boxGreen { fill: #eaf7ef; stroke: #36915f; stroke-width: 2; rx: 8; }
      .boxAmber { fill: #fff5df; stroke: #c98212; stroke-width: 2; rx: 8; }
      .boxRed { fill: #fff0ee; stroke: #d24b3a; stroke-width: 2; rx: 8; }
      .boxPurple { fill: #f2efff; stroke: #7c67c7; stroke-width: 2; rx: 8; }
      .line { stroke: #243447; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .weakLine { stroke: #8b98a8; stroke-width: 2; fill: none; stroke-dasharray: 8 7; marker-end: url(#arrow); }
      .redLine { stroke: #b42318; stroke-width: 2.5; fill: none; stroke-dasharray: 8 7; marker-end: url(#arrowRed); }
      .title { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; font-size: 34px; font-weight: 700; fill: #142033; }
      .subtitle { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; font-size: 21px; fill: #405066; }
      .section { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; font-size: 26px; font-weight: 700; fill: #1f2a3a; }
      .text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; font-size: 18px; fill: #243447; }
      .small { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; font-size: 15px; fill: #405066; }
      .note { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; font-size: 17px; fill: #6b3d00; }
      .bad { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; font-size: 17px; fill: #9f1d13; font-weight: 700; }
      .good { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; font-size: 17px; fill: #17613a; font-weight: 700; }
      .mono { font-family: Consolas, "Liberation Mono", monospace; font-size: 15px; fill: #334155; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1500" height="980"/>

  <text class="title" x="60" y="58">跨库 Adapter 架构为什么现在收益小，以及下一步怎么改</text>
  <text class="subtitle" x="60" y="92">核心矛盾：训练主要优化 text logits，但评估使用 score_cached() 里的最终 image score；visual adapter 在 text_only 下没有被最终目标充分监督。</text>

  <rect class="panel" x="45" y="125" width="670" height="690"/>
  <text class="section" x="75" y="168">现在的流程</text>

  <rect class="boxBlue" x="90" y="205" width="210" height="78"/>
  <text class="text" x="118" y="238">Source 正常样本</text>
  <text class="small" x="120" y="263">建立 source normal gallery</text>

  <rect class="boxBlue" x="90" y="330" width="210" height="78"/>
  <text class="text" x="116" y="363">Source 测试样本</text>
  <text class="small" x="120" y="388">含 normal / abnormal 标签</text>

  <rect class="boxPurple" x="365" y="205" width="245" height="78"/>
  <text class="text" x="398" y="238">VCPA</text>
  <text class="small" x="390" y="263">normal 均值原型 → soft prompt token</text>

  <rect class="boxAmber" x="365" y="330" width="245" height="86"/>
  <text class="text" x="400" y="363">训练 loss</text>
  <text class="small" x="389" y="388">主要是 image-text 分类 logits</text>
  <text class="mono" x="389" y="407">loss(logits_v2t, label)</text>

  <rect class="boxRed" x="365" y="470" width="245" height="92"/>
  <text class="text" x="392" y="502">visual adapter</text>
  <text class="small" x="389" y="527">改视觉特征，但在 text_only</text>
  <text class="small" x="389" y="548">最终分数里作用很间接</text>

  <rect class="boxGreen" x="90" y="600" width="210" height="78"/>
  <text class="text" x="119" y="633">Target 正常样本</text>
  <text class="small" x="118" y="658">重建 target normal gallery</text>

  <rect class="boxGreen" x="365" y="600" width="245" height="78"/>
  <text class="text" x="408" y="633">Target 测试评估</text>
  <text class="small" x="389" y="658">score_cached() 输出 AUROC</text>

  <rect class="boxRed" x="170" y="725" width="365" height="56"/>
  <text class="bad" x="195" y="752">结果：VCPA 有小收益；visual adapter 几乎看不出来</text>
  <text class="small" x="197" y="773">不是一定没用，而是当前评分路径没有公平测试它</text>

  <path class="line" d="M300 244 C325 244 340 244 365 244"/>
  <path class="line" d="M300 369 C325 369 340 369 365 369"/>
  <path class="weakLine" d="M488 416 C488 435 488 450 488 470"/>
  <path class="line" d="M300 639 C325 639 340 639 365 639"/>
  <path class="line" d="M488 562 C488 576 488 586 488 600"/>
  <path class="redLine" d="M610 373 C660 405 660 565 610 636"/>
  <text class="bad" x="616" y="485">最终 AUROC 不等于训练 loss</text>

  <rect class="panel" x="785" y="125" width="670" height="690"/>
  <text class="section" x="815" y="168">推荐改进后的流程</text>

  <rect class="boxBlue" x="830" y="205" width="220" height="78"/>
  <text class="text" x="858" y="238">Source 有标签样本</text>
  <text class="small" x="859" y="263">仍只用 source abnormal 监督</text>

  <rect class="boxGreen" x="830" y="330" width="220" height="78"/>
  <text class="text" x="858" y="363">Target 正常样本</text>
  <text class="small" x="857" y="388">只用于 gallery / 对齐</text>

  <rect class="boxPurple" x="1115" y="205" width="260" height="92"/>
  <text class="text" x="1147" y="238">更强 VCPA</text>
  <text class="small" x="1140" y="263">多个正常原型，而不是一个均值</text>
  <text class="mono" x="1140" y="283">K=2/4 normal prototypes</text>

  <rect class="boxAmber" x="1115" y="350" width="260" height="102"/>
  <text class="text" x="1148" y="383">Final-score supervision</text>
  <text class="small" x="1140" y="408">直接监督评估用的 score_img</text>
  <text class="mono" x="1140" y="430">BCE(score_img, label)</text>

  <rect class="boxBlue" x="830" y="500" width="220" height="92"/>
  <text class="text" x="857" y="533">visual-aware score</text>
  <text class="small" x="855" y="558">text + visual_topk / max</text>
  <text class="small" x="855" y="578">让 visual adapter 被看见</text>

  <rect class="boxGreen" x="1115" y="500" width="260" height="92"/>
  <text class="text" x="1148" y="533">Source-Target normal 对齐</text>
  <text class="small" x="1140" y="558">只用 target normal</text>
  <text class="small" x="1140" y="578">减少跨库 domain shift</text>

  <rect class="boxGreen" x="965" y="650" width="275" height="78"/>
  <text class="text" x="1003" y="683">最终评估路径</text>
  <text class="small" x="1000" y="708">训练和评估都围绕 score_img</text>

  <rect class="boxGreen" x="930" y="755" width="345" height="44"/>
  <text class="good" x="966" y="783">目标：adapter 的改动直接影响最终 AUROC</text>

  <path class="line" d="M1050 244 C1078 244 1092 244 1115 244"/>
  <path class="line" d="M1050 369 C1080 390 1095 405 1115 410"/>
  <path class="line" d="M1245 297 C1245 318 1245 332 1245 350"/>
  <path class="line" d="M1115 405 C1088 431 1058 462 1018 500"/>
  <path class="line" d="M1050 546 C1078 546 1092 546 1115 546"/>
  <path class="line" d="M1245 592 C1228 620 1190 640 1145 650"/>
  <path class="line" d="M940 592 C960 620 995 640 1050 650"/>

  <rect class="panel" x="45" y="850" width="1410" height="90"/>
  <text class="section" x="75" y="890">一句话理解</text>
  <text class="text" x="75" y="924">现在像是“训练时教学生做 A 题，考试时考 B 题”。下一步要让训练 loss 直接对准考试分数 score_img，并让 visual adapter 在考试分数里真正参与。</text>
</svg>
